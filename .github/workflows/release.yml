name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Signing and notarization run only once these secrets exist; until
      # then the release is signed ad hoc.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      # A token that can push to alex-red/homebrew-tap; without it the cask
      # isn't bumped.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            make app CODESIGN_FLAGS=--timestamp
          else
            make app SIGN_IDENTITY=-
          fi

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          make zip
          xcrun notarytool submit "build/GlasshouseTray-$VERSION.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/GlasshouseTray.app

      - name: Package
        run: |
          make zip
          cd build && shasum -a 256 "GlasshouseTray-$VERSION.zip" > "GlasshouseTray-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/GlasshouseTray-$VERSION.zip" \
            "build/GlasshouseTray-$VERSION.zip.sha256" \
            --title "Glasshouse Tray $VERSION" \
            --generate-notes

      - name: Update Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha256="$(cut -d' ' -f1 "build/GlasshouseTray-$VERSION.zip.sha256")"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/alex-red/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
            Casks/glasshouse-tray.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "glasshouse-tray $VERSION"
          git push
