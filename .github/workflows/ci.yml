name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build app
        run: make app zip

      - uses: actions/upload-artifact@v4
        with:
          name: GlasshouseTray-${{ github.sha }}
          path: build/GlasshouseTray-dev.zip
          retention-days: 14
